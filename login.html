<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Entertania</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #14171e;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        .login-card {
            background: #222834;
            border-radius: 16px;
            padding: 40px;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand-logo {
            width: 150px;
            height: auto;
            margin-bottom: 15px;
            filter: invert(1) contrast(200%) brightness(1.5);
            mix-blend-mode: screen;
        }

        .brand-header h2 {
            color: white;
            font-size: 28px;
            font-weight: 600;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            color: #a0a5b1;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            background: #14171e;
            border: 1px solid #2a3456;
            border-radius: 8px;
            color: white;
            font-size: 15px;
            outline: none;
        }

        .input-group input:focus {
            border-color: #4a90e2;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .forgot-link {
            color: #4a90e2;
            text-decoration: none;
            font-size: 13px;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #4a90e2, #3570b2);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .login-btn:hover {
            background: #3570b2;
        }

        .footer-text {
            text-align: center;
            color: #a0a5b1;
            margin-bottom: 20px;
        }

        .register-link {
            color: #4a90e2;
            text-decoration: none;
            font-weight: 600;
        }

        .separator {
            text-align: center;
            color: #2a3456;
            margin: 20px 0;
            position: relative;
        }

        .separator span {
            background: #1a1f2b;
            padding: 0 10px;
            position: relative;
            z-index: 1;
            color: #a0a5b1;
            font-size: 14px;
        }

        .separator::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #2a3456;
            z-index: 0;
        }

        .social-login {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .social-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #2a3456;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
        }

        .social-icon:hover {
            background: #4a90e2;
        }

        .footer-links {
            text-align: center;
            color: #2a3456;
            font-size: 12px;
        }

        .footer-links a {
            color: #a0a5b1;
            text-decoration: none;
            margin: 0 5px;
        }

        .error-message {
            background: rgba(179, 25, 25, 0.1);
            border: 1px solid #b31919;
            color: #b31919;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
            font-size: 13px;
            display: none;
        }

        .success-message {
            background: rgba(74, 222, 128, 0.1);
            border: 1px solid #4ade80;
            color: #4ade80;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
            font-size: 13px;
            display: none;
        }

        .demo-credentials {
            background: #14171e;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            border: 1px dashed #2a3456;
        }

        .demo-credentials p {
            color: #a0a5b1;
            font-size: 12px;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="brand-header">
                <img src="assets/images/Entertanialogo.jpeg" alt="Entertania" class="brand-logo">
                <h2>Welcome Back</h2>
            </div>

            <div id="errorMsg" class="error-message"></div>
            <div id="successMsg" class="success-message"></div>

            <form id="loginForm">
                <div class="input-group">
                    <label for="loginInput">Username or Email</label>
                    <input type="text" id="loginInput" placeholder="Enter your username or email" required>
                </div>

                <div class="input-group">
                    <div class="label-row">
                        <label for="password">Password</label>
                        <a href="#" class="forgot-link" onclick="alert('Please contact support to reset your password')">Forgot?</a>
                    </div>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="login-btn">Log In</button>
            </form>

            <div class="footer-text">
                Don't have an account? <a href="register.html" class="register-link">Sign up</a>
            </div>

            <div class="separator">
                <span>Or continue with</span>
            </div>

            <div class="social-login">
                <button class="social-icon" onclick="socialLogin('google')"><i class='bx bxl-google'></i></button>
                <button class="social-icon" onclick="socialLogin('facebook')"><i class='bx bxl-facebook'></i></button>
                <button class="social-icon" onclick="socialLogin('github')"><i class='bx bxl-github'></i></button>
            </div>

            <div class="footer-links">
                <a href="#">Terms</a> • <a href="#">Privacy</a>
            </div>
        </div>
    </div>

    <script>
        // Initialize users array
        let users = JSON.parse(localStorage.getItem('entertania_users')) || [];

        // Add demo accounts if none exist
        if (users.length === 0) {
            users = [
                {
                    id: '1',
                    username: 'demo',
                    email: 'demo@entertania.com',
                    password: 'demo123',
                    firstName: 'Demo',
                    lastName: 'User',
                    avatar: 'https://ui-avatars.com/api/?name=Demo+User&background=4a90e2&color=fff&size=128',
                    joinDate: new Date().toLocaleDateString()
                },
                {
                    id: '2',
                    username: 'test',
                    email: 'test@entertania.com',
                    password: 'test123',
                    firstName: 'Test',
                    lastName: 'User',
                    avatar: 'https://ui-avatars.com/api/?name=Test+User&background=4a90e2&color=fff&size=128',
                    joinDate: new Date().toLocaleDateString()
                }
            ];
            localStorage.setItem('entertania_users', JSON.stringify(users));
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const loginInput = document.getElementById('loginInput').value.trim();
            const password = document.getElementById('password').value;
            
            document.getElementById('errorMsg').style.display = 'none';
            document.getElementById('successMsg').style.display = 'none';
            
            const user = users.find(u => 
                (u.username === loginInput || u.email === loginInput) && u.password === password
            );
            
            if (user) {
                localStorage.setItem('currentUser', JSON.stringify({
                    id: user.id,
                    username: user.username,
                    email: user.email,
                    name: `${user.firstName} ${user.lastName}`,
                    avatar: user.avatar,
                    joinDate: user.joinDate,
                    loggedIn: true
                }));
                
                document.getElementById('successMsg').textContent = `Welcome back, ${user.username}!`;
                document.getElementById('successMsg').style.display = 'block';
                
                setTimeout(() => {
                    window.location.href = 'profile.html';
                }, 1000);
            } else {
                document.getElementById('errorMsg').textContent = 'Invalid username or password';
                document.getElementById('errorMsg').style.display = 'block';
            }
        });

        function socialLogin(platform) {
            const demoUser = {
                id: Date.now().toString(),
                username: `${platform}_user`,
                email: `${platform}@entertania.com`,
                password: 'social',
                firstName: platform,
                lastName: 'User',
                avatar: `https://ui-avatars.com/api/?name=${platform}+User&background=4a90e2&color=fff&size=128`,
                joinDate: new Date().toLocaleDateString()
            };
            
            localStorage.setItem('currentUser', JSON.stringify({
                id: demoUser.id,
                username: demoUser.username,
                email: demoUser.email,
                name: `${platform} User`,
                avatar: demoUser.avatar,
                joinDate: demoUser.joinDate,
                loggedIn: true
            }));
            
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
